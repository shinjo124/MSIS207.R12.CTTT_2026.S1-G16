openapi: 3.1.0
info:
  title: Tripo API
  version: 1.0.0
  description: API for trip planning, curated destinations, sharing, and travel stories.
servers:
  - url: /
    description: Same origin as the API docs, for local or deployed API
  - url: http://localhost:4000
    description: Local development
paths:
  /api/health:
    get:
      summary: Check API and database availability
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
        '503':
          description: Database is unavailable
  /api/auth/me:
    get:
      summary: Resolve the signed-in Clerk user to a local profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Local profile for the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      email: { type: string, format: email }
                      displayName: { type: string }
        '401': { description: Missing or invalid session token }
        '422': { description: Clerk account has no primary email address }
        '409': { description: The Clerk account's email is already linked to another local profile (EMAIL_IN_USE) }
        '503': { description: Clerk authentication is not configured }
  /api/destinations:
    get:
      summary: List curated destinations (featured only), or every destination with scope=all
      parameters:
        - in: query
          name: category
          schema: { type: string }
          description: Optional exact category filter
        - in: query
          name: scope
          schema: { type: string, enum: [all] }
          description: all = every province and popular spot, used by the trip form's type-ahead search
      responses:
        '200':
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, country, region, category, summary, mapQuery]
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        localName: { type: [string, 'null'], description: 'Vietnamese name with diacritics, e.g. Đà Lạt' }
                        aliases: { type: [string, 'null'], description: 'Comma-separated other names, incl. merged former provinces' }
                        featured: { type: boolean }
                        country: { type: string }
                        region: { type: string }
                        category: { type: string }
                        summary: { type: string }
                        bestSeason: { type: [string, 'null'] }
                        mapQuery: { type: string }
                        imageUrl: { type: [string, 'null'], format: uri }
  /api/destinations/{id}/places:
    get:
      summary: List curated places for a destination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Place list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        destinationId: { type: integer, format: int64 }
                        name: { type: string }
                        category: { type: string }
                        address: { type: [string, 'null'] }
                        summary: { type: string }
                        mapQuery: { type: string }
        '400': { description: Destination ID is invalid }
        '404': { description: Destination was not found }
  /api/trips:
    get:
      summary: List the signed-in user's trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trips owned by the user, newest start date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: Local profile not created yet (PROFILE_NOT_READY) }
    post:
      summary: Create a trip; its itinerary has one day per calendar date (inclusive)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
            example:
              title: A long weekend in Da Lat
              destinationIds: [1]
              startDate: '2026-11-13'
              endDate: '2026-11-16'
              groupSize: 3
              currencyCode: VND
              budget: '5000000'
      responses:
        '201':
          description: Created trip with 4 itinerary days for 13–16 Nov
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/trips/{tripId}:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Read one owned trip with destinations, days and activities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
    put:
      summary: Replace all editable trip fields (same body as POST)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '200':
          description: Updated trip detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
        '409': { description: New dates would leave existing activities outside the trip (ACTIVITIES_OUTSIDE_DATES) }
    delete:
      summary: Delete an owned trip and all its activities
      security:
        - bearerAuth: []
      responses:
        '204': { description: Trip deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
  /api/trips/{tripId}/activities:
    post:
      summary: Add an activity to one day of an owned trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
            example:
              date: '2026-11-13'
              time: '09:00'
              category: sightseeing
              title: Xuan Huong Lake
              city: Da Lat
              address: Tran Quoc Toan, Ward 1
              plannedCost: '0'
              actualSpend: null
              note: Morning walk
      responses:
        '201':
          description: Created activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid field or date outside the trip (DATE_OUTSIDE_TRIP) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
  /api/activities/{activityId}:
    parameters:
      - in: path
        name: activityId
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Update some fields of an activity (e.g. visited check-in or actual spend)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActivityInput'
              required: []
              properties:
                visited: { type: boolean }
            example: { visited: true, actualSpend: '120000' }
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid field, no fields sent, or date outside the trip }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Activity does not exist or its trip is not owned by the signed-in user }
    delete:
      summary: Delete an activity
      security:
        - bearerAuth: []
      responses:
        '204': { description: Activity deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Activity does not exist or its trip is not owned by the signed-in user }
  /api/trips/{tripId}/share:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Check whether the owner's share link is active
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active relative share path, or null when disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sharePath: { type: [string, 'null'] }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
    post:
      summary: Create or replace the owner's read-only share link
      security:
        - bearerAuth: []
      responses:
        '201':
          description: New link created; any previous link is revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shareToken: { type: string, minLength: 64, maxLength: 64 }
                      sharePath: { type: string }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
    delete:
      summary: Revoke the owner's read-only share link
      security:
        - bearerAuth: []
      responses:
        '204': { description: Link revoked or already disabled }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
  /api/share/{token}:
    get:
      summary: Read a trip through an active unlisted link
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Read-only, public-safe trip details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      title: { type: string }
                      startDate: { type: string, format: date }
                      endDate: { type: string, format: date }
                      groupSize: { type: integer }
                      budget: { type: string, example: '1000.00' }
                      currencyCode: { type: string, minLength: 3, maxLength: 3 }
                      destinations: { type: array, items: { type: object } }
        '404': { description: Link is invalid, revoked, or unavailable }
        '429': { description: Request limit reached }
  /api/posts:
    get:
      summary: Browse public travel stories
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 12 }
      responses:
        '200':
          description: Public posts with photos and interaction counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
                        tripId: { type: [integer, 'null'], format: int64 }
                        placeId: { type: [integer, 'null'], format: int64 }
                        author: { type: string }
                        likesCount: { type: integer }
                        commentsCount: { type: integer }
                        photos:
                          type: array
                          items:
                            type: object
                            properties:
                              imageUrl: { type: string, format: uri }
                              altText: { type: string }
        '429': { description: Request limit reached }
    post:
      summary: Publish or save a travel story
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                visibility: { type: string, enum: [public, private], default: public }
                tripId: { type: [integer, 'null'] }
                placeId: { type: [integer, 'null'] }
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [url, altText]
                    properties:
                      url: { type: string, format: uri }
                      altText: { type: string, minLength: 1, maxLength: 255 }
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                visibility: { type: string, enum: [public, private], default: public }
                tripId: { type: integer, minimum: 1 }
                placeId: { type: integer, minimum: 1 }
                image: { type: string, format: binary, description: Optional JPEG, PNG, or WebP image, maximum 5 MB }
                altText: { type: string, minLength: 1, maxLength: 255, description: Required when image is provided }
      responses:
        '201': { description: Post created }
        '400': { description: Post input is invalid }
        '401': { description: Missing or invalid session token }
        '404': { description: Optional trip or place was not found }
        '413': { description: Image is larger than 5 MB }
        '415': { description: Image type is not JPEG, PNG, or WebP }
        '429': { description: Request limit reached }
        '503': { description: Cloudinary photo storage is not configured }
  /api/posts/mine:
    get:
      summary: List the signed-in user's own public and private stories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user's latest 50 stories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        visibility: { type: string, enum: [public, private] }
                        createdAt: { type: string, format: date-time }
                        tripId: { type: [integer, 'null'], format: int64 }
                        placeId: { type: [integer, 'null'], format: int64 }
                        likesCount: { type: integer }
                        commentsCount: { type: integer }
                        photos: { type: array, items: { type: object } }
        '401': { description: Missing or invalid session token }
        '409': { description: Local profile is not available yet }
        '429': { description: Request limit reached }
  /api/posts/{id}/likes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Like a public post (idempotent)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Post liked or already liked }
        '401': { description: Missing or invalid session token }
        '404': { description: Public post was not found }
    delete:
      summary: Remove the signed-in user's like
      security:
        - bearerAuth: []
      responses:
        '204': { description: Like removed or already absent }
        '401': { description: Missing or invalid session token }
  /api/posts/{id}/comments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: List comments on a public post
      responses:
        '200':
          description: Comments in creation order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
                        author: { type: string }
        '404': { description: Public post was not found }
    post:
      summary: Comment on a public post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      body: { type: string }
        '400': { description: Comment input is invalid }
        '401': { description: Missing or invalid session token }
        '404': { description: Public post was not found }
        '429': { description: Request limit reached }
  /api/trip-photos:
    post:
      summary: Upload an owner's trip photo to Cloudinary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tripId, image]
              properties:
                tripId: { type: integer, minimum: 1 }
                image: { type: string, format: binary }
                caption: { type: string, maxLength: 500 }
                locationText: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Photo stored and attached to the owner's trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      imageUrl: { type: string, format: uri }
                      caption: { type: [string, 'null'] }
                      locationText: { type: [string, 'null'] }
        '400': { description: Image or trip ID is missing or invalid }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
        '409': { description: Profile is unavailable or trip photo limit reached }
        '413': { description: Image is larger than 5 MB }
        '415': { description: Image type is not JPEG, PNG, or WebP }
        '429': { description: Upload or API request limit reached }
        '503': { description: Cloudinary photo storage is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthenticated:
      description: Missing or invalid session token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input, e.g. END_BEFORE_START, INVALID_BUDGET, INVALID_DESTINATIONS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Money:
      type: string
      description: Decimal amount (DECIMAL(12,2)) as a string, never negative
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      example: '5000000.00'
    TripInput:
      type: object
      required: [title, destinationIds, startDate, endDate, groupSize, currencyCode, budget]
      properties:
        title: { type: string, maxLength: 160 }
        destinationIds: { type: array, minItems: 1, maxItems: 10, items: { type: integer }, description: In visiting order }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Inclusive; must not be before startDate; at most 60 days }
        groupSize: { type: integer, minimum: 1, maximum: 100 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        budget: { $ref: '#/components/schemas/Money' }
    TripSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dayCount: { type: integer, description: Calendar difference + 1 }
        groupSize: { type: integer }
        budget: { $ref: '#/components/schemas/Money' }
        currencyCode: { type: string }
        shareEnabled: { type: boolean }
        destinations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              country: { type: string }
              mapQuery: { type: string }
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          properties:
            days:
              type: array
              items:
                type: object
                properties:
                  dayNumber: { type: integer }
                  date: { type: string, format: date }
                  activities: { type: array, items: { $ref: '#/components/schemas/Activity' } }
    ActivityInput:
      type: object
      required: [date, category, title]
      properties:
        date: { type: string, format: date, description: Must be within the trip dates }
        time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
        category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
        title: { type: string, maxLength: 160, description: Place or activity name }
        city: { type: [string, 'null'], maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 255 }
        plannedCost: { $ref: '#/components/schemas/Money' }
        actualSpend:
          description: null = not recorded (not zero)
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 1000 }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityInput'
        - type: object
          properties:
            id: { type: integer }
            tripId: { type: integer }
            visited: { type: boolean }
