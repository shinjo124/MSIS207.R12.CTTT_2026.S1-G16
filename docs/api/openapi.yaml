openapi: 3.1.0
info:
  title: Tripo API
  version: 1.0.0
  description: API for trip planning, curated destinations, sharing, and travel stories.
servers:
  - url: /
    description: Same origin as the API docs, for local or deployed API
  - url: http://localhost:4000
    description: Local development
paths:
  /api/news:
    get:
      summary: Read cached travel headlines from the configured RSS sources
      responses:
        '200': { description: Articles with source metadata, or an unavailable status when feeds fail }
  /api/health:
    get:
      summary: Check API and database availability
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
        '503':
          description: Database is unavailable
  /api/auth/me:
    get:
      summary: Resolve the signed-in Clerk user to a local profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Local profile for the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      email: { type: string, format: email }
                      displayName: { type: string }
        '401': { description: Missing or invalid session token }
        '422': { description: Clerk account has no primary email address }
        '409': { description: The Clerk account's email is already linked to another local profile (EMAIL_IN_USE) }
        '503': { description: Clerk authentication is not configured }
  /api/destinations:
    get:
      summary: List curated destinations (featured only), every destination (scope=all) or the 34 provinces and cities (scope=provinces)
      parameters:
        - in: query
          name: category
          schema: { type: string }
          description: Optional exact category filter
        - in: query
          name: scope
          schema: { type: string, enum: [all, provinces] }
          description: all = every province and popular spot, used by the trip form's type-ahead search; provinces = the 34 provincial-level units for the Explore page
      responses:
        '200':
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, country, region, category, summary, mapQuery]
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        localName: { type: [string, 'null'], description: 'Vietnamese name with diacritics, e.g. Đà Lạt' }
                        aliases: { type: [string, 'null'], description: 'Comma-separated other names, incl. merged former provinces' }
                        featured: { type: boolean }
                        country: { type: string }
                        region: { type: string }
                        category: { type: string }
                        summary: { type: string }
                        bestSeason: { type: [string, 'null'] }
                        mapQuery: { type: string }
                        imageUrl: { type: [string, 'null'], format: uri }
  /api/destinations/{id}:
    get:
      summary: One public catalogue destination (used by the Explore province page)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: The destination, including adminLevel, mergedFrom, summary and summaryVi }
        '400': { description: INVALID_DESTINATION_ID }
        '404': { description: DESTINATION_NOT_FOUND }
  /api/destinations/{id}/google-places:
    get:
      summary: Live place ideas from Google Maps (Places API Text Search) for a catalogue destination
      description: Signed-in users only. Results come straight from Google and are not stored. Show the "Google Maps" attribution with them.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [sights, food, cafe, nature, culture, shopping] }
        - in: query
          name: lang
          schema: { type: string, enum: [vi, en], default: vi }
      responses:
        '200':
          description: Up to 10 places
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        address: { type: string }
                        mapsUrl: { type: string, format: uri }
                        type: { type: string }
                        rating: { type: number }
                        ratingCount: { type: integer }
        '400': { description: INVALID_DESTINATION_ID or INVALID_PLACE_TYPE }
        '401': { description: Not signed in }
        '404': { description: DESTINATION_NOT_FOUND }
        '429': { description: GOOGLE_PLACES_RATE_LIMITED (30 searches per 15 minutes per user) }
        '503': { description: GOOGLE_PLACES_NOT_CONFIGURED or GOOGLE_PLACES_UNAVAILABLE }
  /api/destinations/{id}/places:
    get:
      summary: List curated places for a destination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Place list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        destinationId: { type: integer, format: int64 }
                        name: { type: string }
                        category: { type: string }
                        address: { type: [string, 'null'] }
                        summary: { type: string }
                        mapQuery: { type: string }
        '400': { description: Destination ID is invalid }
        '404': { description: Destination was not found }
  /api/trips/{tripId}/weather-location:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      summary: Set a confirmed weather location for an accessible trip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationId, latitude, longitude, timeZone, confirmed]
              properties:
                destinationId: { type: integer, minimum: 1, description: Must belong to the trip }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                timeZone: { type: string, description: Confirmed IANA time zone }
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200': { description: Confirmed location saved }
        '400': { description: Invalid or unconfirmed location, or destination not in trip }
        '404': { description: Trip unavailable or caller has no access }
    delete:
      summary: Remove the trip weather location and stop weather requests for it
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Location removed }
        '404': { description: Trip unavailable or caller has no access }
  /api/trips/{tripId}/weather:
    get:
      summary: Read weather for a trip day or destination from OpenWeather
      description: Requires trip access. Forecasts are 3-hour samples selected near noon on each destination-local date, not daily highs or lows. If destinationId is supplied it must belong to the trip; otherwise date selects that day's destination assignment.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Trip day whose assigned destination supplies the forecast; defaults to the trip start date.
        - in: query
          name: destinationId
          schema: { type: integer, minimum: 1 }
          description: Optional trip destination to use when one forecast covers multiple visible days.
      responses:
        '200': { description: Status is not-configured, missing-location, or available with current conditions and dated forecast samples }
        '404': { description: Trip unavailable or caller has no access }
        '429': { description: Weather rate limit reached }
        '503': { description: Weather provider unavailable }
  /api/assistant:
    post:
      summary: Ask Tribot (Google Gemini) a general travel question, without a trip
      description: Used by the floating chat when no trip is chosen. Only the conversation is sent to Gemini. Answers are not stored and suggestions are always empty.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Tribot's reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reply: { type: string }
                      suggestions: { type: array, maxItems: 0, items: { type: object } }
        '400': { description: INVALID_MESSAGES }
        '401': { description: Not signed in }
        '429': { description: Tribot rate limit reached (shared with the trip endpoint) }
        '503': { description: ASSISTANT_NOT_CONFIGURED or ASSISTANT_UNAVAILABLE }
  /api/trips/{tripId}/assistant:
    post:
      summary: Ask Tribot (Google Gemini) about this trip or about travel
      description: Requires trip access. The API sends the trip plan, budget and catalogue places for the trip's destinations to Gemini. Answers are not stored. Suggestions are proposals only; add one with POST /api/trips/{tripId}/activities.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 12
                  description: Conversation so far, oldest first; the last message must be from the user.
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Tribot's reply and up to five suggested activities inside the trip dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reply: { type: string }
                      suggestions:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          required: [title, date, category]
                          properties:
                            title: { type: string }
                            date: { type: string, format: date }
                            time: { type: string, example: '19:00' }
                            durationMinutes: { type: integer }
                            category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
                            city: { type: string }
                            address: { type: string }
                            plannedCost: { type: string, example: '150000' }
                            note: { type: string }
        '400': { description: INVALID_TRIP_ID or INVALID_MESSAGES }
        '401': { description: Not signed in }
        '404': { description: Trip unavailable or caller has no access }
        '429': { description: Tribot rate limit reached (20 questions per 15 minutes per user) }
        '503': { description: ASSISTANT_NOT_CONFIGURED (no GEMINI_API_KEY) or ASSISTANT_UNAVAILABLE }
  /api/trips/{tripId}/days/{date}/destination:
    put:
      summary: Assign one of the trip destinations to a trip day
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationId]
              properties:
                destinationId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Day destination updated; trip revision advances }
        '400': { description: Invalid date or destination is not part of the trip }
        '404': { description: Trip unavailable or caller has no access }
  /api/trips/{tripId}/version:
    get:
      summary: Get the current revision of an accessible trip
      description: The revision advances when trip detail or its activities change. With wait=1 and since, hold the response for up to eight seconds of waiting and check the shared database approximately once per second. Access is rechecked on every database read. The client cancels on hidden tabs, offline state, edits and writes. Database latency adds to these timings.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: sync
          schema: { type: string, enum: ['1'] }
          description: Marks a periodic refresh for its separate rate limit.
        - in: query
          name: wait
          schema: { type: string, enum: ['1'] }
          description: Enable bounded long polling; requires since. Omit for an immediate response.
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Last observed revision; required with wait=1.
      responses:
        '200':
          description: Current revision
          content:
            application/json:
              schema:
                type: object
                properties:
                  pollAfterMs:
                    type: integer
                    enum: [0]
                    description: Present for completed long polls; renew immediately. Older servers omit this and clients retain their five-second fallback.
                  data:
                    type: object
                    properties:
                      revision: { type: integer, minimum: 1 }
        '400': { description: Invalid trip ID or long-poll revision }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip unavailable or caller has no access }
  /api/trips/{tripId}/invitations:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Owner creates a single-use invitation valid for 24 hours
      description: Creating an invitation revokes any previous unconsumed invitation. Treat the returned token as a secret.
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Invitation token and expiration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string, pattern: '^[a-f0-9]{64}$' }
                      expiresAt: { type: string, format: date-time }
        '404': { description: Trip unavailable or caller is not the owner }
    delete:
      summary: Owner revokes the outstanding invitation
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Invitation revoked }
        '404': { description: Trip unavailable or caller is not the owner }
  /api/trips/invitations/accept:
    post:
      summary: Signed-in recipient accepts an invitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Membership granted and invitation consumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tripId: { type: integer }
        '404': { description: Invalid, expired, revoked or consumed invitation }
  /api/trips/{tripId}/members:
    get:
      summary: Owner lists trip members
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Members with userId and displayName }
        '404': { description: Trip unavailable or caller is not the owner }
  /api/trips/{tripId}/members/{userId}:
    delete:
      summary: Owner removes a member
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Membership revoked }
        '404': { description: Trip or member unavailable, or caller is not the owner }
  /api/trips:
    get:
      summary: List the signed-in user's trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trips owned by or shared with the user, newest start date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: Local profile not created yet (PROFILE_NOT_READY) }
    post:
      summary: Create a trip; its itinerary has one day per calendar date (inclusive)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
            example:
              title: A long weekend in Da Lat
              destinations:
                - id: 1
                - { name: Tà Năng, country: Vietnam }
              startDate: '2026-11-13'
              endDate: '2026-11-16'
              groupSize: 3
              currencyCode: VND
              budget: '5000000'
      responses:
        '201':
          description: Created trip with 4 itinerary days for 13–16 Nov
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/trips/{tripId}:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Read one owned trip with destinations, days and activities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
    put:
      summary: Replace all editable trip fields using the revision last read
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TripInput' }
                - type: object
                  required: [revision]
                  properties:
                    revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated trip detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
        '409': { description: Stale revision (TRIP_CONFLICT) or activities outside the new dates (ACTIVITIES_OUTSIDE_DATES) }
    delete:
      summary: Delete an owned trip and all its activities
      security:
        - bearerAuth: []
      responses:
        '204': { description: Trip deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
  /api/trips/{tripId}/activities:
    post:
      summary: Add an activity to one day of an owned trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
            example:
              date: '2026-11-13'
              time: '09:00'
              category: sightseeing
              title: Xuan Huong Lake
              city: Da Lat
              address: Tran Quoc Toan, Ward 1
              plannedCost: '0'
              actualSpend: null
              note: Morning walk
      responses:
        '201':
          description: Created activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid field or date outside the trip (DATE_OUTSIDE_TRIP) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Trip does not exist or is not owned by the signed-in user }
  /api/activities/{activityId}:
    parameters:
      - in: path
        name: activityId
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Update some fields of an activity (e.g. visited check-in or actual spend)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: Version last read by this client }
                date: { type: string, format: date }
                time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
                durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
                category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
                title: { type: string, maxLength: 160 }
                city: { type: [string, 'null'], maxLength: 120 }
                address: { type: [string, 'null'], maxLength: 255 }
                plannedCost: { $ref: '#/components/schemas/Money' }
                actualSpend: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                note: { type: [string, 'null'], maxLength: 1000 }
                visited: { type: boolean }
            example: { version: 1, visited: true, actualSpend: '120000' }
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid field, no fields sent, or date outside the trip }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Activity does not exist or its trip is not owned by the signed-in user }
        '409': { description: ACTIVITY_CONFLICT; reload the latest activity before editing }
    delete:
      summary: Delete an activity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: Version last read by this client }
      responses:
        '204': { description: Activity deleted }
        '400': { description: Missing or invalid version }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Activity does not exist or its trip is not owned by the signed-in user }
        '409': { description: ACTIVITY_CONFLICT; reload the latest activity before deleting }
  /api/trips/{tripId}/share:
    parameters:
      - in: path
        name: tripId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Check whether the owner's share link is active
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active relative share path, or null when disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sharePath: { type: [string, 'null'] }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
    post:
      summary: Create or replace the owner's read-only share link
      security:
        - bearerAuth: []
      responses:
        '201':
          description: New link created; any previous link is revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shareToken: { type: string, minLength: 64, maxLength: 64 }
                      sharePath: { type: string }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
    delete:
      summary: Revoke the owner's read-only share link
      security:
        - bearerAuth: []
      responses:
        '204': { description: Link revoked or already disabled }
        '401': { description: Missing or invalid session token }
        '404': { description: Trip is not owned by the signed-in user }
  /api/share/{token}:
    get:
      summary: Read a trip through an active unlisted link
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Read-only, public-safe trip details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      title: { type: string }
                      startDate: { type: string, format: date }
                      endDate: { type: string, format: date }
                      groupSize: { type: integer }
                      budget: { type: string, example: '1000.00' }
                      currencyCode: { type: string, minLength: 3, maxLength: 3 }
                      timeZone: { type: [string, 'null'], description: Confirmed trip IANA time zone; null means unknown }
                      destinations: { type: array, items: { type: object } }
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            dayNumber: { type: integer }
                            date: { type: string, format: date }
                            activities: { type: array, items: { $ref: '#/components/schemas/SharedActivity' } }
        '404': { description: Link is invalid, revoked, or unavailable }
        '429': { description: Request limit reached }
  /api/posts:
    get:
      summary: Browse public travel stories
      security: [{}, { bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 12 }
      responses:
        '200':
          description: Public posts with photos and interaction counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasMore: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
                        tripId: { type: [integer, 'null'], format: int64 }
                        placeId: { type: [integer, 'null'], format: int64 }
                        place:
                          type: [object, 'null']
                          description: Linked place shown on the story card; null when no place is linked
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            category: { type: string }
                            address: { type: [string, 'null'] }
                            mapQuery: { type: string }
                            destination:
                              type: [object, 'null']
                              properties:
                                id: { type: integer }
                                name: { type: string, description: Vietnamese display name when available }
                                region: { type: string }
                        author: { type: string }
                        liked: { type: boolean, description: Whether the signed-in viewer likes the post }
                        likesCount: { type: integer }
                        commentsCount: { type: integer }
                        photos:
                          type: array
                          items:
                            type: object
                            properties:
                              imageUrl: { type: string, format: uri }
                              altText: { type: string }
        '429': { description: Request limit reached }
    post:
      summary: Publish or save a travel story
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                visibility: { type: string, enum: [public, private], default: public }
                tripId: { type: [integer, 'null'] }
                placeId: { type: [integer, 'null'] }
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [url, altText]
                    properties:
                      url: { type: string, format: uri }
                      altText: { type: string, minLength: 1, maxLength: 255 }
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                visibility: { type: string, enum: [public, private], default: public }
                tripId: { type: integer, minimum: 1 }
                placeId: { type: integer, minimum: 1 }
                image: { type: string, format: binary, description: 'Optional JPEG, PNG, or WebP image, maximum 4 MB' }
                altText: { type: string, minLength: 1, maxLength: 255, description: Required when image is provided }
      responses:
        '201': { description: Post created }
        '400': { description: Post input is invalid }
        '401': { description: Missing or invalid session token }
        '404': { description: Optional trip or place was not found }
        '413': { description: Image is larger than 4 MB }
        '415': { description: Image type is not JPEG, PNG, or WebP }
        '429': { description: Request limit reached }
        '503': { description: Cloudinary photo storage is not configured }
  /api/posts/mine:
    get:
      summary: List the signed-in user's own public and private stories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user's latest 50 stories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        visibility: { type: string, enum: [public, private] }
                        createdAt: { type: string, format: date-time }
                        tripId: { type: [integer, 'null'], format: int64 }
                        placeId: { type: [integer, 'null'], format: int64 }
                        place:
                          type: [object, 'null']
                          description: Linked place shown on the story card; null when no place is linked
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            category: { type: string }
                            address: { type: [string, 'null'] }
                            mapQuery: { type: string }
                            destination:
                              type: [object, 'null']
                              properties:
                                id: { type: integer }
                                name: { type: string, description: Vietnamese display name when available }
                                region: { type: string }
                        likesCount: { type: integer }
                        commentsCount: { type: integer }
                        photos: { type: array, items: { type: object } }
        '401': { description: Missing or invalid session token }
        '409': { description: Local profile is not available yet }
        '429': { description: Request limit reached }
  /api/posts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Edit the text of the signed-in user's own story
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Updated story text in data.body }
        '400': { description: Invalid post ID or story text }
        '401': { description: Missing or invalid session token }
        '404': { description: Post was not found or is not the user's own }
    delete:
      summary: Delete the signed-in user's own story (its photos are queued for cleanup)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Story deleted }
        '400': { description: Invalid post ID }
        '401': { description: Missing or invalid session token }
        '404': { description: Post was not found or is not the user's own }
  /api/posts/{id}/likes:
    parameters:
      - { in: query, name: summary, schema: { type: integer, enum: [1] }, description: Return the updated count and viewer like state }
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Like a public post (idempotent)
      security:
        - bearerAuth: []
      responses:
        '200': { description: Current likesCount and liked in data when summary=1 }
        '204': { description: Post liked or already liked }
        '401': { description: Missing or invalid session token }
        '404': { description: Public post was not found }
    delete:
      summary: Remove the signed-in user's like
      security:
        - bearerAuth: []
      responses:
        '200': { description: Current likesCount and liked in data when summary=1 }
        '204': { description: Like removed or already absent }
        '401': { description: Missing or invalid session token }
  /api/posts/{id}/comments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: List comments on a public post
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Comments in creation order
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextOffset: { type: [integer, 'null'] }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
                        author: { type: string }
        '404': { description: Public post was not found }
    post:
      summary: Comment on a public post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      body: { type: string }
                      author: { type: string }
        '400': { description: Comment input is invalid }
        '401': { description: Missing or invalid session token }
        '404': { description: Public post was not found }
        '429': { description: Request limit reached }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthenticated:
      description: Missing or invalid session token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input, e.g. END_BEFORE_START, INVALID_BUDGET, INVALID_DESTINATIONS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Money:
      type: string
      description: Decimal amount (DECIMAL(12,2)) as a string, never negative
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      example: '5000000.00'
    MoneySummary:
      type: string
      description: Decimal budget summary with two fractional digits; remaining may be negative.
      pattern: '^-?[0-9]+([.][0-9]{2})$'
      example: '-250.00'
    TripInput:
      type: object
      required: [title, startDate, endDate, groupSize, currencyCode, budget]
      oneOf:
        - required: [destinationIds]
        - required: [destinations]
      properties:
        title: { type: string, maxLength: 160 }
        destinationIds: { type: array, minItems: 1, maxItems: 10, items: { type: integer }, description: Existing destination IDs in visiting order. A custom ID must belong to this trip. }
        destinations:
          type: array
          minItems: 1
          maxItems: 10
          description: Catalog IDs, existing custom IDs owned by this trip, or new custom destinations, in visiting order. Custom destinations are excluded from the public catalog.
          items:
            type: object
            oneOf:
              - required: [id]
                properties:
                  id: { type: integer, minimum: 1 }
              - required: [name, country]
                properties:
                  name: { type: string, minLength: 1, maxLength: 120 }
                  country: { type: string, minLength: 1, maxLength: 120 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Inclusive; must not be before startDate; at most 60 days }
        groupSize: { type: integer, minimum: 1, maximum: 100 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        budget: { $ref: '#/components/schemas/Money' }
        timeZone: { type: [string, 'null'], maxLength: 64, description: Confirmed IANA time zone or null; omit to preserve it when destinations do not change }
        timeZoneConfirmed: { type: boolean, description: Must be true when setting a non-null timeZone }
    TripSummary:
      type: object
      properties:
        id: { type: integer }
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        timeZone: { type: [string, 'null'], description: Confirmed trip IANA time zone; null means unknown }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dayCount: { type: integer, description: Calendar difference + 1 }
        groupSize: { type: integer }
        budget: { $ref: '#/components/schemas/Money' }
        currencyCode: { type: string }
        shareEnabled: { type: boolean }
        destinations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              country: { type: string }
              mapQuery: { type: string }
              custom: { type: boolean, description: True for destinations scoped to this trip }
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          properties:
            role: { type: string, enum: [owner, member], description: Role of the signed-in user }
            budgetSummary:
              type: object
              properties:
                budget: { $ref: '#/components/schemas/Money' }
                plannedTotal: { $ref: '#/components/schemas/MoneySummary' }
                totalActualSpend: { $ref: '#/components/schemas/MoneySummary' }
                remainingBudget:
                  allOf: [{ $ref: '#/components/schemas/MoneySummary' }]
                  description: Budget minus recorded spend; negative when over budget.
                overBudget:
                  allOf: [{ $ref: '#/components/schemas/MoneySummary' }]
                  description: Non-negative amount by which recorded spend exceeds budget.
                spendByCategory:
                  type: array
                  items:
                    type: object
                    properties:
                      category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
                      amount: { $ref: '#/components/schemas/MoneySummary' }
            days:
              type: array
              items:
                type: object
                properties:
                  dayNumber: { type: integer }
                  date: { type: string, format: date }
                  destinationId: { type: integer, format: int64, nullable: true }
                  activities: { type: array, items: { $ref: '#/components/schemas/Activity' } }
    ActivityInput:
      type: object
      required: [date, category, title]
      properties:
        date: { type: string, format: date, description: Must be within the trip dates }
        time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
        durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440, description: Duration in minutes; null means not recorded }
        category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
        title: { type: string, maxLength: 160, description: Place or activity name }
        city: { type: [string, 'null'], maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 255 }
        plannedCost: { $ref: '#/components/schemas/Money' }
        actualSpend:
          description: null = not recorded (not zero)
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 1000 }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityInput'
        - type: object
          properties:
            id: { type: integer }
            tripId: { type: integer }
            visited: { type: boolean }
            version: { type: integer, minimum: 1, description: Required for the next activity PATCH }
    SharedActivity:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
        durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440, description: Duration in minutes; null means not recorded }
        category: { type: string, enum: [sightseeing, food_drink, accommodation, transport, shopping, other] }
        title: { type: string }
        city: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
